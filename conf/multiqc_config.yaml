title: "BarBeQuE report"
subtitle: "BARcode BEnchmarking and QUality Evaluation"

custom_logo: "pipelinelogo.png"
custom_logo_title: "BarBeQuE"
custom_logo_url: "https://github.com/bio-raum/BarBeQuE"

skip_versions_section: false
log_filesize_limit: 100000000

versions_table_group_header: "Module"

extra_fn_clean_exts:
  - _R1
  - _R2
  - _duplicate_metrics.txt
  - .pass

report_comment: >
  This report has been generated automatically by bio-raum/BarBeQuE.

report_header_info:
  - Application Type: "Metabarcoding"

top_modules:
  - "general_stats"

# Higher parent/module numbers are placed higher in the report. Section numbers
# within each parent are listed in ascending order.
report_section_order:
  # Sample sheet (primers and their amplicon length bounds) at the very top
  samplesheet:
    order: 200000

  # Analysis groups follow their module order in workflows/barbeque.nf
  obipcr:
    order: 100000

  build_db_taxids:
    order: 90000

  cluster_consensus:
    order: 80000

  taxonomic_coverage:
    order: 70000

  # OBI-PCR sections, first to last
  obipcr_summary:
    order: 100
  obipcr_amplicon_recovery:
    order: 200
  obipcr_gc:
    order: 300
  obipcr_errors:
    order: 400
  obipcr_positions:
    order: 500
  obipcr_amplicon_lengths:
    order: 600
  obipcr_amplicon_gc:
    order: 700

  # Cluster consensus sections, first to last
  cluster_consensus_summary:
    order: 100
  cluster_consensus_resolution:
    order: 200
  cluster_consensus_size:
    order: 300
  taxon_search:
    order: 400

  # Taxonomic coverage sections, first to last
  taxonomic_coverage_summary:
    order: 100
  taxonomic_coverage_details:
    order: 200

  # Settings used for the run, just above the software versions at the bottom
  barbeque_settings:
    order: -1000

  software_versions:
    order: -1001
